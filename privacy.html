<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プライバシーと広告方針 | ClipCost Lab</title><style>body{font:16px/1.8 system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#192432}a{color:#126b62}</style><h1>プライバシーと広告方針</h1><p>診断の入力情報はブラウザ内で処理され、当サイトのアプリケーションから外部へ送信されません。アカウント登録や決済は提供していません。ホスティング事業者が配信に伴う通信情報を処理する場合があります。</p><p>外部リンクを開いた場合には、各リンク先の規約とプライバシーポリシーが適用されます。</p><p>現在、掲載リンクにアフィリエイト報酬は発生しません。提携を開始する際には該当リンクと広告表示を明示し、本方針を更新します。</p><p>料金やサービス仕様は変わる場合があります。公式情報を確認してください。</p><p>更新：2026年11月27日</p><a href="index.html">診断に戻る</a></html>
